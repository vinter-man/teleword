[project]
name = "teleword"
version = "3.0.0"
description = "Telegram bot that helps you memorise English words through daily quizzes built from your own examples."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20,<4",
    "sqlalchemy[asyncio]>=2.0.40,<2.2",
    "aiosqlite>=0.21",
    "pydantic-settings>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "redis>=5.2",
    "openpyxl>=3.1.5",
    "matplotlib>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teleword"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:aiogram.*"]

[tool.coverage.run]
source = ["teleword"]
concurrency = ["greenlet", "thread"]
omit = ["teleword/bot/__main__.py", "teleword/db/__main__.py"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF012"]
